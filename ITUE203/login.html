<!DOCTYPE html>
<html>
<head>
  <title>Student Login Portal</title>
  <link rel="stylesheet" href="login.css">
  <script src="login.js"></script>
  
</head>
<body>
  <h1>Student Login Portal</h1>
  <div class="login-box">
    <h2>Login</h2>
    <form onsubmit="return loginUser()">
      <input type="text" id="username" placeholder="Username" required><br>
      <input type="password" id="password" placeholder="Password" required><br>
      <input type="submit" value="Login">
      <div style="justify-content: left; margin-right: 280px;">
        <a style="font-family: 'Courier New', Courier, monospace; color: rgb(255, 0, 0);" href="register.html">Register</a>
      </div>
    </form>
  </div>
</body>
</html>
